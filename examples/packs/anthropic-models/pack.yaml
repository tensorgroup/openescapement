schema: 1
name: anthropic-models
version: 0.4.1
description: Model selection guidance for Anthropic Claude. Which model, when, and why. Every status carries the reason and, where it departs from the vendor's default, the condition that would reverse it.

rules:
  - rules/model-selection.md

catalog:
  - name: Claude Fable 5.1 (claude-fable-5-1)
    category: model
    status: preferred
    notes: The default for planning, design, review, debugging, and any problem that is not simple. Anthropic's most capable widely released model; thinking is always on. $10/$50 per 1M tokens; requires 30-day data retention; its safety classifiers may refuse security-adjacent work, so keep a fallback.
  - name: Claude Opus 5.5 (claude-opus-5-5)
    category: model
    status: allowed
    notes: The Opus-tier choice when Fable's price or retention requirement is the constraint, and Anthropic's own recommended starting point. Everyday coding, long agentic runs, planning behind a reviewed spec. $4/$20 per 1M tokens, cheaper than the Opus models it replaces. Thinking is always on and default effort is medium, one level below its predecessors, so set effort explicitly. Forced tool_choice (any or tool) returns a 400.
  - name: Claude Sonnet 5.5 (claude-sonnet-5-5)
    category: model
    status: allowed
    notes: Cost and latency saver. Routine coding, high-volume pipelines, subagents, and executors working from a written plan with tests. $2/$10 per 1M tokens, the same as Sonnet 5. Effort levels are recalibrated, so re-run the effort sweep. Disabled thinking and forced tool_choice (any or tool) return a 400; use thinking type between_tools and auto instead.
  - name: Claude Haiku 4.5 (claude-haiku-4-5)
    category: model
    status: allowed
    notes: High-volume simple tasks such as classification and extraction. $1/$5 per 1M tokens; 200K context.
  - name: Claude Opus 5 (claude-opus-5)
    category: model
    status: review-required
    notes: Legacy; Anthropic no longer lists it among current models. Superseded by Opus 5.5 at a lower price ($4/$20 against $5/$25), and in the maintainers' logged agentic use (2026-09) it proved weaker than Opus 4.8. Still served; migrate existing pins to Opus 5.5 rather than starting new work on it.
  - name: Claude Opus 4.8 (claude-opus-4-8)
    category: model
    status: review-required
    notes: Legacy since Opus 5.5 shipped. It was this pack's Opus-tier choice through 2026-09; migrate pins to Opus 5.5, which is cheaper ($4/$20 against $5/$25). When migrating, thinking can no longer be disabled and forced tool_choice is rejected, so lower effort and use auto instead.
  - name: Claude Fable 5 (claude-fable-5)
    category: model
    status: review-required
    notes: Superseded by Fable 5.1 in the same tier at the same price. Still served; migrate existing pins rather than starting new work on it.
  - name: Claude Sonnet 5 (claude-sonnet-5)
    category: model
    status: review-required
    notes: Legacy since Sonnet 5.5 shipped. It was this pack's Sonnet-tier choice through 2026-09; migrate pins to Sonnet 5.5 at the same $2/$10. When migrating, disabled thinking and forced tool_choice are rejected, and effort levels are recalibrated.
