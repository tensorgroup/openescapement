schema: 1
name: model-seats
version: 0.6.0
description: Governance for multi-model agent collaboration. Which seat holds which duty, with what oversight, decided from logged dispute outcomes rather than vibes. Seats are named by role; the model behind each is a config detail that changes. Copy and adapt. The catalog's reference roster is a dated example, not a recommendation; replace it with yours.

rules:
  - rules/seat-policy.md
  - rules/panel-protocol.md
  - rules/decision-model-routing.md
  - rules/lead-rotation.md
  - rules/explanation-style.md

catalog:
  - name: Moderator seat (the lead, the agent the user works in)
    category: model-seat
    status: preferred
    notes: Frames the brief, runs the seats, cross-examines disputes, verifies every surviving finding against the code, and writes the record, naming itself by resolved model id. The only seat that ever changes the checkout, under OS-level containment. Never outsources the ruling and never scores itself.
  - name: Claude lead on a non-Anthropic plan (reference roster, 2026-10, claude-opus-5-5 via agy on a Google AI plan)
    category: model-seat
    status: review-required
    notes: A Claude-family lead that does not draw on an Anthropic plan, so it can take over when that plan is capped. Lead quality not yet scored; compare it with first-party Claude Code on the same profile before ranking it in a lead order.
  - name: Gemini lead on a Google AI plan (reference roster, 2026-11, gemini-4-neon-high via agy)
    category: model-seat
    status: review-required
    notes: Third in the reference lead order. The first-party Claude lead runs while the Anthropic plan has quota, then the OpenAI lead, then this lead when both plans are capped. Runs with manual approval until the harness's hooks are verified. Lead quality not yet scored.
  - name: Planning seat (reference roster, 2026-11, gpt-6.2-astra via a read-only Codex CLI config file)
    category: model-seat
    status: preferred
    notes: First voice on plan, design, and decision targets; equal peer on code review. Moved from gpt-6-astra to OpenAI's 6.2 generation on 2026-11-27. Full peer status from a fresh scoreboard on 2026-09-11 when the seat changed model generation. The previous occupant's demotion (wording disputes, conceded substance) was that model's trait and did not carry over; re-demote only on logged dispute evidence. The reference user runs gpt-6.2-sol as a driver (a working agent that the lead hands spec'd, mechanical work to on a budget), not as a seat. Sol shares this seat's vendor and model family, so its blind read would correlate with this seat's, and a panel gains more from a seat on another vendor.
  - name: Metered peer seat (reference roster, 2026-11, deepseek/deepseek-v4.1-flash via pi on OpenRouter behind a read-only agent, thinking medium)
    category: model-seat
    status: preferred
    notes: Peer at design, plan, and code review, metered at OpenRouter's list price (see the deepseek-models pack), so cost is rarely the reason to skip it. Moved from glm-5.3-flash on 2026-11-27, after the reference user's scoreboard showed this model doing the same job with far fewer timeouts and more unique catches. The seat keeps the scoreboard this model started on trial on 2026-10-24. Use the alias, which resolves to the 2026-09-10 release at a flat price. The -1017 id is the later 2026-10-17 release, so it is a different model, not a snapshot of the alias. Set a spend cap on the OpenRouter key. The seat's first model was a stealth preview id that the provider retired within weeks, which is why policy names the seat and config names the model.
  - name: Blind same-vendor seat (reference roster, 2026-11, claude-opus-5-5 in a fresh headless session)
    category: model-seat
    status: preferred
    notes: The moderator's own model family, run with none of the moderator's conversation, so its round-1 agreement is an independent signal. Scored as a peer; the moderator must not favor it. Moved from claude-fable-5-1 on 2026-11-11 on cost. Fable costs twice as much, and the reference user's panels found Opus 5.5 plus the planning seat as good in practice. A new model starts a fresh scoreboard. Reverse it when Fable's escalation runs show confirmed unique catches that this seat missed on the same targets.
  - name: Reserved escalation seat (reference roster, 2026-11, claude-fable-5-2 in a fresh headless session)
    category: model-seat
    status: reserved
    notes: Joins only deep panels and debugging that is stuck (a failed first fix, a recurring bug, or seats that still disagree after cross-examination), or when the user asks for it. The most capable same-vendor model at twice the price of the default, so it runs only on a deliberate escalation. Each run records its reason and is scored like every other seat, so the scoreboard shows whether the escalation earns its price.
  - name: Google stand-in seat (reference roster, 2026-11, gemini-4-neon-high via agy on a Google AI plan)
    category: model-seat
    status: review-required
    notes: The stand-in seat. When the planning seat's plan or the Kimi seat's plan is capped, this seat runs in its place. It is scored under its own name, and the capped seat is recorded as absent (usage cap). It is a peer on design, plan, and review, with a fresh scoreboard from 2026-11-20. It replaces the 2026-10 trial seat on gemini-4-argon-high, which was paused on 2026-10-30 because Argon's quota on the plan ran out repeatedly. agy encodes the effort level in the model id. agy writes a cache file into its working directory, so run it from the seat's own home with the reviewed repo added read-only.
  - name: Kimi peer seat (trial, 2026-10, kimi-code/k3.1-pro via Kimi Code under an OS sandbox)
    category: model-seat
    status: review-required
    notes: On trial from 2026-10-24 with a fresh scoreboard. Peer on review; plan on trial. Kimi Code ignored its own deny rules in non-interactive mode in a 2026-10-24 test, so the OS sandbox is the enforcement and a hook is only a second layer.
  - name: Decision model for routing advice (reference, 2026-09, typesafe/jev-1.13 via OpenRouter's decisions API)
    category: decision-model
    status: review-required
    notes: Hosted, input-only billing (about $0.042 per million tokens), about 0.2 to 0.3 seconds per call, several typed questions answered in one request. Pilot status in the reference setup since 2026-09-29, advisory and raise-only. Pin the version, because thresholds are tuned against one release.
  - name: Self-hosted decision model (Kev, SemIf, OpenJev, Laya; NanoJev and jevlike as training starters)
    category: decision-model
    status: review-required
    notes: Keeps task text inside your network. Some expose a System One-compatible API, but context budgets and question limits differ, so a swap is not a config change. Run a contract test, a truncation test, and a re-calibration on logged tasks first.
  - name: Decision-model routing that lowers a pin or skips a mandatory review
    category: decision-model
    status: banned
    notes: Uncalibrated advice may only raise. A downgrade or a skipped review is a cost saving paid for with an unmeasured risk.
  - name: Unmoderated multi-model debate (no logging, no substance bar)
    category: model-seat
    status: banned
    notes: Panels without an accountable moderator and outcome logging produce rhetoric, not signal. Every panel is logged or it did not happen.
  - name: An external review seat with write access to the checkout
    category: model-seat
    status: banned
    notes: External review seats are enforced read-only at the OS level and verified by attack, on fresh and resumed sessions, after every harness upgrade. Only the lead writes, under the containment the lead-rotation rule requires. The lead's own vendor may still sit as a fresh blind session with none of the lead's conversation; only a seat that shares the lead's session is excluded, since that is the lead reviewing its own reasoning.
