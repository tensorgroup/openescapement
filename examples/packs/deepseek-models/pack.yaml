schema: 1
name: deepseek-models
version: 0.1.0
description: Model selection guidance for DeepSeek. V4.1 Flash is the fast, cheap model for second opinions and triage, named by its DeepSeek API id and its OpenRouter id so each route gets the right one. V4 Pro stays the planning and review model.

rules:
  - rules/model-selection.md

catalog:
  - name: DeepSeek V4.1 Flash, DeepSeek API (deepseek-flash)
    category: model
    status: preferred
    notes: Fast, cheap second opinions, triage, coding, and bulk work. 1M context, 384K max output. $0.30/$1.20 per 1M tokens at peak, $0.15/$0.60 off-peak (2026-10-24). Served as model version DeepSeek-V4.1-Flash-1017.
  - name: DeepSeek V4.1 Flash, OpenRouter (deepseek/deepseek-v4.1-flash)
    category: model
    status: preferred
    notes: The same model through OpenRouter, the alias to use there. Provider price $0.02/$1.00 per 1M tokens on 2026-10-24, far under DeepSeek's own list on input; a provider price that can end without notice. Set a spend cap on the OpenRouter key.
  - name: DeepSeek V4.1 Flash, OpenRouter dated snapshot (deepseek/deepseek-v4.1-flash-1017)
    category: model
    status: allowed
    notes: A stable id for configs that must not move when the alias advances. Provider price $0.15/$0.60 per 1M tokens on 2026-10-24, more than the alias on input and less on output.
  - name: DeepSeek V4 Pro (deepseek-v4-pro)
    category: model
    status: allowed
    notes: The planning and review model, for its Think Max mode, until a V4.1 Pro ships. $1.32/$3.96 per 1M tokens at peak, $0.66/$1.98 off-peak (2026-10-24).
  - name: Retired DeepSeek ids (deepseek-chat, deepseek-reasoner, deepseek-v4-flash, deepseek-v4-flash-vision-exp)
    category: model
    status: banned
    notes: Retired 2026-07-24 (chat, reasoner) and 2026-09-10 (the V4 Flash pair, still routed to V4.1 Flash for now). Move configs to deepseek-flash or deepseek-v4-pro.
