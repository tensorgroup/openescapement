schema: 1
name: zai-models
version: 0.1.1
description: Model selection guidance for Z.ai's GLM family, reached through OpenRouter. GLM 5.3 Flash is the near-free metered model; it was served as a stealth preview before release, and the retired preview id is banned here by name so a stale config is caught, not guessed at.

rules:
  - rules/model-selection.md

catalog:
  - name: GLM 5.3 Flash (z-ai/glm-5.3-flash on OpenRouter)
    category: model
    status: preferred
    notes: The cheap metered model for second opinions, code review, long-context reads, and bulk work. Released 2026-08-26 with MIT-licensed weights; 320B parameters, 18B active; text, image, and video in; tools and structured outputs. 1.31M context on paper, 262K to 1.31M depending on which provider OpenRouter routes to, so pin a provider when the window matters. List price $0.15/$0.50 per 1M tokens at Z.ai; OpenRouter providers post $0.075 to $0.15 in and $0.25 to $0.50 out (2026-09-16), the cheapest a per-provider discount that can end without notice. The dated snapshot z-ai/glm-5.3-flash-20260826 is the same model with a stable id.
  - name: GLM 5.3 Flash, dated snapshot (z-ai/glm-5.3-flash-20260826)
    category: model
    status: allowed
    notes: The same model behind a stable id, for configs that must not move when the alias advances. Same price and limits as z-ai/glm-5.3-flash.
  - name: GLM 5.3 (z-ai/glm-5.3)
    category: model
    status: allowed
    notes: The full-size sibling for when Flash's answers run thin. Z.ai lists $1.4/$4.4 per 1M tokens; OpenRouter providers posted $0.8775/$2.97 in 2026-09. 1.31M context.
  - name: stealth/ox-alpha (OpenRouter preview id)
    category: model
    status: banned
    notes: The stealth id GLM 5.3 Flash was served under before release. Retired 2026-09-02; requests fail. Any config still naming it must move to z-ai/glm-5.3-flash. This is why model ids belong in config and never in an interface.
